[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dashguard"
version = "0.1.0"
description = "DashGuard video and telemetry risk-event pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.4",
    "opencv-python==5.0.0.93",
    "ultralytics==8.4.107",
    "gradio==6.22.0",
    "lap==0.5.13",
    "onnx==1.22.0",
    "onnxruntime==1.28.0",
    "onnxslim==0.1.95",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
